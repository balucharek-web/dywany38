 .pomoc-link {

<script type="module">
import * as ZXing from 'https://cdn.jsdelivr.net/npm/@zxing/library@latest/+esm';

// -----------------------------
// KONFIG
// -----------------------------
let storeId = localStorage.getItem('store_id') || null;
let storeNumber = localStorage.getItem('store_number') || null;
let storeName = localStorage.getItem('store_name') || null;

const HINTS = new Map();
HINTS.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8]);
HINTS.set(ZXing.DecodeHintType.TRY_HARDER, true);

let codeReader = null;
function ensureCodeReader(){ if(!codeReader) codeReader = new ZXing.BrowserMultiFormatReader(HINTS); }

const MIN_THROTTLE = 80; // ms
const TIMEOUT_MS = 30000; // wydłużone do 30s — konfigurowalne

// -----------------------------
// ELEMENTY / STAN
// -----------------------------
let activeStream = null;
let activeVideo = null;
let scanLoopId = null;
let scanned = false;
let lastDecode = 0;
let scanMode = "normal"; // normal | cards
let timeoutHandle = null;
let globalCanvas = null; // reuse canvas
let globalCtx = null;
let cardItems = [];

// -----------------------------
// HELPERS
// -----------------------------
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showPopup(msg){ const p=document.getElementById('customPopup'); p.textContent=msg; p.style.display='block'; p.style.opacity='1'; setTimeout(()=>{ p.style.opacity='0'; setTimeout(()=>{ p.style.display='none'; },300); }, 2500); }

function startTimeout(){ clearTimeoutScanner(); timeoutHandle = setTimeout(()=>{ if(!scanned){ showPopup('Brak odczytu — spróbuj bliżej, stabilniej.'); stopScanner(); } }, TIMEOUT_MS); }
function clearTimeoutScanner(){ if(timeoutHandle){ clearTimeout(timeoutHandle); timeoutHandle=null; } }

// -----------------------------
// VIDEO
// -----------------------------
async function getVideo(){
  return await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1080}, frameRate:{ideal:30,max:60} } });
}

async function toggleTorch(stream, enable){ try{ const track = stream.getVideoTracks()[0]; const caps = track.getCapabilities(); if(!caps.torch) return false; await track.applyConstraints({advanced:[{torch:enable}]}); return true;}catch(e){return false;} }

// -----------------------------
// ROI → CANVAS (reused)
// -----------------------------
function ensureGlobalCanvas(){ if(globalCanvas) return; globalCanvas = document.createElement('canvas'); globalCanvas.style.display='none'; document.body.appendChild(globalCanvas); globalCtx = globalCanvas.getContext('2d'); }

function roiCanvas(video){ try{
  const vf = video.getBoundingClientRect();
  const fr = document.getElementById('scanner-frame').getBoundingClientRect();
  const vw = video.videoWidth; const vh = video.videoHeight; if(!vw||!vh) return null;
  const sx = (fr.left - vf.left) * (vw/vf.width);
  const sy = (fr.top  - vf.top ) * (vh/vf.height);
  const sw = fr.width  * (vw/vf.width);
  const sh = fr.height * (vh/vf.height);

  // limit width to reasonable size — balance quality/speed
  const outW = Math.max(800, Math.min(1400, Math.round(sw)));
  const outH = Math.round(outW * (sh/sw));

  ensureGlobalCanvas();
  if(globalCanvas.width !== outW || globalCanvas.height !== outH){ globalCanvas.width = outW; globalCanvas.height = outH; }
  globalCtx.imageSmoothingEnabled = true;
  globalCtx.drawImage(video, sx, sy, sw, sh, 0,0, globalCanvas.width, globalCanvas.height);
  return globalCanvas;
 }catch(e){ return null; }
}

// -----------------------------
// PREPROCESS: grayscale + contrast stretch + unsharp mask
// -----------------------------
function preprocess(cvs){ try{
  const ctx = cvs.getContext('2d');
  const img = ctx.getImageData(0,0,cvs.width,cvs.height);
  const d = img.data;
  // grayscale + linear contrast boost
  let min=255,max=0;
  for(let i=0;i<d.length;i+=4){ const g = Math.round(d[i]*0.3 + d[i+1]*0.59 + d[i+2]*0.11); d[i]=d[i+1]=d[i+2]=g; if(g<min)min=g; if(g>max)max=g; }
  const span = Math.max(1,max-min);
  const mult = 255/span;
  for(let i=0;i<d.length;i+=4){ const v=d[i]; const nv = Math.round((v-min)*mult); d[i]=d[i+1]=d[i+2]=nv; }
  ctx.putImageData(img,0,0);

  // simple unsharp mask (fast): blur copy and combine
  // create small blurred version
  const tmp = document.createElement('canvas'); tmp.width=cvs.width; tmp.height=cvs.height; const tctx = tmp.getContext('2d');
  // gaussian-like blur via multiple draws (fast approximation)
  tctx.drawImage(cvs,0,0);
  tctx.globalAlpha = 0.5; // light blur layer
  for(let i=0;i<2;i++) tctx.drawImage(tmp, -1, 0), tctx.drawImage(tmp, 1, 0), tctx.drawImage(tmp, 0, -1), tctx.drawImage(tmp, 0, 1);
  tctx.globalAlpha = 1;

  const base = ctx.getImageData(0,0,cvs.width,cvs.height);
  const blur = tctx.getImageData(0,0,cvs.width,cvs.height);
  for(let i=0;i<base.data.length;i+=4){ const sharp = base.data[i] - (blur.data[i]*0.6 - 0); const v = Math.min(255, Math.max(0, Math.round(base.data[i] + sharp*0.6))); base.data[i]=base.data[i+1]=base.data[i+2]=v; }
  ctx.putImageData(base,0,0);
  return cvs;
 }catch(e){ return cvs; }
}

// -----------------------------
// HYBRID DECODER
// -----------------------------
function decodeHybrid(cvs){ try{
  const lum = new ZXing.HTMLCanvasElementLuminanceSource(cvs);
  const bin = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum));
  const reader = new ZXing.MultiFormatReader();
  reader.setHints(HINTS);
  const res = reader.decode(bin);
  return res?.text || null;
 }catch(e){ return null; }
}

// -----------------------------
// LEGACY DECODE
// -----------------------------
async function decodeLegacy(cvs){ try{ ensureCodeReader(); return await codeReader.decodeFromImage(cvs); }catch(e){ return null; } }

// -----------------------------
// SNAPSHOT FALLBACK
// -----------------------------
async function snapshotFallback(){ return new Promise(resolve=>{ const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.capture='environment'; inp.style.display='none'; document.body.appendChild(inp);
  inp.onchange=()=>{ const f=inp.files[0]; if(!f){ document.body.removeChild(inp); resolve(null); return; } const url=URL.createObjectURL(f); const img=new Image(); img.onload=async()=>{ ensureGlobalCanvas(); globalCanvas.width=img.width; globalCanvas.height=img.height; globalCtx.drawImage(img,0,0); const h = decodeHybrid(preprocess(globalCanvas)); URL.revokeObjectURL(url); document.body.removeChild(inp); resolve(h); }; img.src=url; }; inp.click(); }); }

// -----------------------------
// BEEP
// -----------------------------
async function beep(){ const a=document.getElementById('beep-sound'); try{ await a.play(); return; }catch(e){} try{ const ctx=new AudioContext(); const osc=ctx.createOscillator(); const g=ctx.createGain(); osc.frequency.value=1100; osc.connect(g); g.connect(ctx.destination); osc.start(); g.gain.setValueAtTime(0.3,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.2); osc.stop(ctx.currentTime+0.21); }catch(e){} }

// -----------------------------
// SCAN LOOP
// -----------------------------
function startScanner(){ ensureCodeReader(); scanned=false; lastDecode=0; document.getElementById('fullscreen-scanner').style.display='block';
      // show photo-scan button when scanner active
      try{ const ps = document.getElementById('photoScanBtn'); if(ps) ps.style.display='block'; }catch(e){}
  document.getElementById('scanner').innerHTML=`<video id="cam" autoplay playsinline muted></video>`;
  const video = document.getElementById('cam');
  (async()=>{
    try{
      activeStream = await getVideo(); video.srcObject = activeStream; await video.play(); try{ await toggleTorch(activeStream,false); }catch(e){}
      activeVideo = video; startTimeout(); let fails=0;
      async function loop(){
        if(!activeVideo) return;
        const now = performance.now(); if(now-lastDecode < MIN_THROTTLE){ scanLoopId=requestAnimationFrame(loop); return; }
        lastDecode = now;
        const cvs = roiCanvas(activeVideo);
        if(!cvs){ scanLoopId=requestAnimationFrame(loop); return; }

        let text = decodeHybrid(cvs);
        if(!text) text = decodeHybrid(preprocess(cvs));
        if(!text) text = await decodeLegacy(cvs);

        if (text) {
    const frame = document.getElementById('scanner-frame');
    if (frame) {
        frame.classList.add('detect');
        setTimeout(() => frame.classList.remove('detect'), 400);
    }

    const clean = text.replace(/\D/g, '');

    if (clean.length === 13 || clean.length === 8) {
        if (frame) {
            frame.classList.add('found');
            setTimeout(() => frame.classList.remove('found'), 700);
        }

        scanned = true;
        await beep();

        if (scanMode === 'normal') {
            document.getElementById('q').value = clean;
            stopScanner();
            doSearch();
            return;
        }

        if (scanMode === 'cards') {
            cardItems.push({ location: 'EAN', reference: clean });
            renderCardList();
           

            await new Promise(r => setTimeout(r, 300));
            stopScanner();
            return;
        }
    }
} else {
    fails++;
}

        if(false){ /* automatic snapshot disabled — user must click 📸 Skan z zdjęcia */ }
        scanLoopId=requestAnimationFrame(loop);
      }
      scanLoopId=requestAnimationFrame(loop);
    }catch(err){ showPopup('Błąd kamery: '+err.message); stopScanner(); }
  })();
}

function stopScanner(){ document.getElementById('fullscreen-scanner').style.display='none';
  // hide photo-scan button when scanner stops
  try{ const ps = document.getElementById('photoScanBtn'); if(ps) ps.style.display='none'; }catch(e){} clearTimeoutScanner(); if(scanLoopId){ cancelAnimationFrame(scanLoopId); scanLoopId=null; }
  if(activeStream){ activeStream.getTracks().forEach(t=>t.stop()); activeStream=null; }
  if(activeVideo){ try{ activeVideo.pause(); activeVideo.srcObject=null; }catch(e){} activeVideo=null; }
  if(codeReader){ try{ codeReader.reset(); }catch(e){} }
}

// -----------------------------
// SEARCH / RENDER
// -----------------------------
async function doSearch(){ const q=document.getElementById('q').value.trim(); if(!q) return; const loader=document.getElementById('searchLoader'); const btn=document.getElementById('searchBtn'); loader.style.display='inline-block'; btn.disabled=true; try{ const res = await fetch('api_search.php',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({q, store_id:storeId}) }); const txt = await res.text(); const data = JSON.parse(txt); if(data.success) renderProduct(data.data); else renderProduct(null); }catch(e){ showPopup('Błąd sieci: '+e.message); } loader.style.display='none'; btn.disabled=false; }
function renderProduct(d){ const r=document.getElementById('result'); r.style.display='block'; if(!d){ r.innerHTML='<div>Brak wyników.</div>'; return; } 
  
  // Sprawdź czy d jest tablicą (wiele lokalizacji) czy obiektem (pojedyncza lokalizacja)
  const locations = Array.isArray(d) ? d : [d];
  
  // Główny produkt (pierwszy wynik)
  const first = locations[0];
  const createdAt = first.created_at ? String(first.created_at) : '';
  const createdDate = createdAt ? createdAt.slice(0,10) : '';
  let html = `<div class="row"> <div class="col"><div class="label">Nazwa</div><div class="val">${escapeHtml(first.name)}</div>${createdDate ? `<div class="meta">Dodano: ${escapeHtml(createdDate)}</div>` : ''}</div> <div class="col"><div class="label">Ref.</div><div class="val">${escapeHtml(first.reference)}</div></div> <div class="col"><div class="label">EAN</div><div class="val">${escapeHtml(first.ean)}</div></div> </div>`;
  
  // Wszystkie lokalizacje
  if (locations.length > 1) {
    const locationTags = locations.map(loc => 
      `<span style="background:var(--accent);color:white;padding:4px 8px;margin:2px;border-radius:4px;font-size:0.9rem;font-weight:600">${escapeHtml(loc.location)}${escapeHtml(loc.sub||'')}</span>`
    ).join('');
    
    html += `<div style="margin-top:12px"><div class="label" style="margin-bottom:8px">Wszystkie lokalizacje (${locations.length}):</div><div style="display:flex;flex-wrap:wrap;gap:4px">${locationTags}</div></div>`;
  } else {
    // Pojedyncza lokalizacja
    html += `<div class="row" style="margin-top:8px"> <div class="col"><div class="label">Miejsce</div><div class="val">${escapeHtml(first.location)} ${escapeHtml(first.sub||'')}</div></div> </div>`;
  }
  
  r.innerHTML = html;
}

// -----------------------------
// FISZKI
// -----------------------------
function renderCardList(){ const cardList = document.getElementById('cardList'); cardList.innerHTML=''; cardItems.forEach((item,i)=>{ const div=document.createElement('div'); div.style.display='flex'; div.style.justifyContent='space-between'; div.style.alignItems='center'; div.style.padding='6px'; div.style.borderBottom='1px solid #f0f0f0';
  const datePart = item.created_at ? ` <span style="font-weight:700;color:#6b7280;font-size:12px">(${escapeHtml(String(item.created_at).slice(0,10))})</span>` : '';
  const isDateItem = (item.location === 'DATA');
  const mainText = isDateItem
    ? `${escapeHtml(item.reference||'Brak')}${datePart}`
    : `${escapeHtml(item.location)} → ${escapeHtml(item.reference||'Brak')}${datePart}`;
  div.innerHTML = `<span style="font-weight:600">${mainText}</span>`;
  const btn=document.createElement('button'); btn.textContent='❌'; btn.style.background='transparent'; btn.style.border='none'; btn.style.cursor='pointer'; btn.dataset.i=i; btn.onclick=()=>{ cardItems.splice(i,1); renderCardList(); }; div.appendChild(btn); cardList.appendChild(div); }); }

// EVENTS

document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('resetStoreBtn').onclick=()=>{ localStorage.clear(); location.reload(); };
  document.getElementById('saveStoreBtn').onclick=()=>{ const v=document.getElementById('storeNumberInput').value.trim(); if(!v){ alert('Podaj numer sklepu'); return; } fetchStoreName(v); };
  document.getElementById('scanBtn').onclick=()=>{ scanMode='normal'; startScanner(); };
  document.getElementById('close-scanner').onclick=stopScanner;
  if(storeId && storeNumber && storeName){ renderStoreInfo(); document.getElementById('storeModal').style.display='none'; }
  document.getElementById('searchBtn').onclick=doSearch;
  let searchTimer = null;
document.getElementById('q').addEventListener('input', () => {
    clearTimeout(searchTimer);
    const val = document.getElementById('q').value.trim();
    if (val.length === 0) {
        document.getElementById('result').style.display = 'none';
        return;
    }
    searchTimer = setTimeout(() => {
        doSearch();
    }, 400);
});
document.getElementById('q').onkeydown=e=>{ if(e.key==='Enter') doSearch(); };
  document.getElementById('manageWarehouseBtn').addEventListener('click', ()=>{ location.href='index.php'; });

  // card modal bindings
  document.getElementById('generateCardBtn').addEventListener('click', ()=>{ cardItems=[]; document.getElementById('cardLocationInput').value=''; const d=document.getElementById('cardDateInput'); if(d) d.value=''; renderCardList(); document.getElementById('cardModal').style.display='block'; });
  document.getElementById('closeCardBtn').addEventListener('click', ()=>{ document.getElementById('cardModal').style.display='none'; });
  document.getElementById('addCardBtn').addEventListener('click', async ()=>{
    const loc = (document.getElementById('cardLocationInput').value || '').trim().toUpperCase(); if(!loc){ alert('Podaj miejsce magazynowe'); return; }
    try{ const res = await fetch('api_search.php',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({q:loc, store_id:storeId}) }); const data = await res.json(); const ref = (data && data.success && data.data) ? data.data.reference : null; cardItems.push({ location: loc, reference: ref }); renderCardList(); document.getElementById('cardLocationInput').value=''; document.getElementById('cardLocationInput').focus(); }catch(err){ showPopup('Błąd pobierania danych: '+err.message); }
  });

  document.getElementById('addCardsByDateBtn').addEventListener('click', async ()=>{
    const dateStr = (document.getElementById('cardDateInput').value || '').trim();
    if(!dateStr){ alert('Wybierz datę'); return; }
    try{
      const res = await fetch('api_search.php',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ store_id:storeId, refs_by_date: dateStr }) });
      const data = await res.json();
      if(!data || !data.success){ showPopup((data && data.error) ? data.error : 'Błąd pobierania'); return; }
      const refs = Array.isArray(data.data) ? data.data : [];
      if(refs.length === 0){ showPopup('Brak produktów z tej daty'); return; }
      refs.forEach(ref => {
        if(!ref) return;
        cardItems.push({ location: 'DATA', reference: String(ref), created_at: dateStr });
      });
      renderCardList();
      showPopup('Dodano: ' + refs.length);
    }catch(err){ showPopup('Błąd pobierania: ' + err.message); }
  });

  document.getElementById('scanCardBtn').addEventListener('click', ()=>{ scanMode='cards'; startScanner(); });

  document.getElementById('finishCardBtn').addEventListener('click', ()=>{
    const refs = cardItems.map(c => c.reference).filter(Boolean).join(',');
    if (!refs) { 
        showPopup('Brak referencji do skopiowania'); 
        return; 
    }

    navigator.clipboard.writeText(refs).then(() => {

        showPopup('Skopiowano: ' + refs + ' — za 3 sekundy nastąpi przekierowanie do Kakemono.');

        document.getElementById('cardModal').style.display = 'none';

        setTimeout(() => {
            const tab = window.open('', '_blank');
            if (tab) tab.location.href = 'https://kakemono.apps.pl.corp.leroymerlin.com/login';
        }, 3000);

    }).catch(err => {
        showPopup('Nie udało się skopiować: ' + err);
    });
});
  });



// -----------------------------
// STORE NAME
// -----------------------------
async function fetchStoreName(num){ try{ const res = await fetch(`get_store.php?numer=${encodeURIComponent(num)}`); const txt = await res.text(); const data = JSON.parse(txt); if(data.success){ storeId = data.id; storeNumber = data.numer; storeName = data.name; localStorage.setItem('store_id', storeId); localStorage.setItem('store_number', storeNumber); localStorage.setItem('store_name', storeName); renderStoreInfo(); document.getElementById('storeModal').style.display='none'; } else { alert('Nie znaleziono sklepu'); } }catch(e){ alert('Błąd serwera: '+(e.message||e)); } }
function renderStoreInfo(){ document.getElementById('store-info').innerHTML = `<strong>Sklep ${escapeHtml(storeNumber)}</strong><div>${escapeHtml(storeName||'')}</div>`; document.getElementById('main-content').style.display='block'; }

// hide any leftover manual photo button in top controls and wire photoScanBtn
(function(){
  try{
    document.addEventListener('DOMContentLoaded', ()=>{
      try{
        const headerBtns = Array.from(document.querySelectorAll('.buttons button'));
        headerBtns.forEach(b=>{ if(b.textContent && b.textContent.includes('📷 Zdjęcie')) b.style.display='none'; });
      }catch(e){}

      const ps = document.getElementById('photoScanBtn');
      if(ps){
        ps.addEventListener('click', async ()=>{
          ps.disabled = true;
          try{
            const code = await snapshotFallback();
            if(!code){ showPopup('Nie wykryto kodu na zdjęciu'); ps.disabled=false; return; }
            const clean = code.replace(/\D/g,'');
            if(clean.length===13||clean.length===8){
              if(scanMode==='normal'){
                document.getElementById('q').value = clean;
                stopScanner();
                doSearch();
              }else{
                cardItems.push({location:'EAN', reference:clean}); renderCardList(); showPopup('Dodano EAN: '+clean);
              }
            } else { showPopup('Brak wykrytego kodu na zdjęciu'); }
          }catch(e){ showPopup('Błąd przy przetwarzaniu zdjęcia'); }
          ps.style.display='none';
          ps.disabled = false;
        });
      }
    });
  }catch(e){}
  })();
</script>
